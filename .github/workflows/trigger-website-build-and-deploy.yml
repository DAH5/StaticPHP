name: Trigger Website Build and Deploy

on:
  push:
    branches: [master]

jobs:
  notify-website:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Website Build and Deploy
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_TRIGGER_TOKEN }}
        run: |
          gh api repos/DAH5/StaticPHP-Website/dispatches \
            --method POST \
            --include \
            -f event_type=staticphp-updated